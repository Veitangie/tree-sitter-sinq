name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
    tags: ["vscode-[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "src/**"
      - "grammar.js"
      - "vscode/**"
  pull_request:
    branches: ["**"]
    paths:
      - "src/**"
      - "grammar.js"
      - "vscode/**"
  release:
    types: [published]

jobs:
  test:
    name: Test Parser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: npm install

      - name: Generate and Test Parser
        run: |
          npx tree-sitter generate
          npx tree-sitter test

  generate-abi14:
    name: Generate ABI 14 Parser
    needs: test
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: npm install

      - name: Generate Parser
        run: npx tree-sitter generate --abi 14

      - name: Share Generated Sources
        uses: actions/upload-artifact@v4
        with:
          name: parser-abi14
          path: src/

  build:
    name: Build on ${{ matrix.os }}
    needs: generate-abi14
    if: github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: tree-sitter-sinq-linux-x64
            ext: so
            cc: gcc -O3 -shared -fPIC

          - os: macos-latest
            artifact: tree-sitter-sinq-macos-x64
            ext: dylib
            cc: clang -O3 -dynamiclib -fPIC -arch x86_64

          - os: macos-latest
            artifact: tree-sitter-sinq-macos-arm64
            ext: dylib
            cc: clang -O3 -dynamiclib -fPIC -arch arm64

          - os: windows-latest
            artifact: tree-sitter-sinq-windows-x64
            ext: dll
            cc: gcc -O3 -shared

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch ABI 14 Sources
        uses: actions/download-artifact@v4
        with:
          name: parser-abi14
          path: src-abi14

      - name: Compile Parser
        run: ${{ matrix.cc }} -I src src/parser.c src/scanner.c -o ${{ matrix.artifact }}.${{ matrix.ext }}

      - name: Compile ABI 14 Parser
        run: ${{ matrix.cc }} -I src-abi14 src-abi14/parser.c src-abi14/scanner.c -o ${{ matrix.artifact }}-abi14.${{ matrix.ext }}

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ${{ matrix.artifact }}.${{ matrix.ext }} ${{ matrix.artifact }}-abi14.${{ matrix.ext }} --clobber

  build-vscode:
    name: Build VS Code Extension
    needs: test
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6

      - name: Check Tag Matches Extension Version
        if: startsWith(github.ref, 'refs/tags/vscode-')
        run: test "${GITHUB_REF_NAME#vscode-}" = "$(node -p "require('./vscode/package.json').version")"

      - name: Resolve Query Symlinks for Packaging
        run: |
          rm -rf vscode/queries
          mkdir -p vscode/queries
          if [ -d "queries/sinq" ]; then
            cp -r queries/sinq/* vscode/queries/
          else
            cp -r queries/* vscode/queries/
          fi
          cp LICENSE.md vscode/LICENSE.md

      - name: Install Root Dependencies
        run: npm install

      - name: Install Extension Dependencies
        working-directory: ./vscode
        run: npm install

      - name: Compile WASM files for Extension
        run: |
          mkdir -p vscode/bin
          npx tree-sitter build --wasm -o vscode/bin/tree-sitter-sinq.wasm

      - name: Package into VSIX
        working-directory: ./vscode
        run: npx @vscode/vsce package

      - name: Save VSIX as a Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinq-helper-vsix
          path: vscode/*.vsix

      - name: Upload VSIX to the Latest GitHub Release
        if: startsWith(github.ref, 'refs/tags/vscode-')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$(gh release view --json tagName --jq .tagName)" vscode/*.vsix --clobber
